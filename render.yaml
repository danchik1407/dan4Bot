# ============================================================================
#  Render Blueprint: два сервиса, каждый в СВОЁМ workspace.
# ----------------------------------------------------------------------------
#  Важно (задача 38 — «Not Found» и 405 на HEAD /):
#    * оба сервиса собираются из КОРНЯ репозитория (rootDir: .), где лежат
#      api.py, bot.py и папка miniapp/ — если rootDir указать на подпапку,
#      aura-api стартует без miniapp/ и раздавать фронтенд ему нечем;
#    * healthCheckPath: /api/ping — дешёвый ответ без базы, на GET и HEAD
#      (Render проверяет именно HEAD; раньше он получал 405 Method Not Allowed
#      и сервис считался «нездоровым»).
#
#  Как применять: Render → New → Blueprint → репозиторий dan4Bot.
#  Секреты (SUPABASE_KEY, BOT_TOKEN и т.д.) Render спросит при создании —
#  они помечены sync: false и в git не попадают.
# ============================================================================

services:
  # ---------------------------------------------------------------- aura-api
  - type: web
    name: aura-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # --proxy-headers и --forwarded-allow-ips: Render терминирует HTTPS и
    # ходит на сервис по внутреннему http, а нам нужен настоящий host/origin
    # в ссылках Mini App.
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ЗАДАЧА 65: игра ОТКРЫТА ВСЕМ, и это больше не зависит от окружения.
      #
      # Раньше здесь стояли ADMIN_ONLY_APP=0 / MAINTENANCE_MODE=0, но в самом
      # сервисе на Render остались значения "1" от задачи 57: blueprint их не
      # перезаписывает, код читал их — и игроки видели экран «Технические
      # работы» («скоро откроем всем») даже после деплоя.
      # Теперь код эти имена НЕ читает совсем, а из blueprint они убраны, чтобы
      # никто снова не включил закрытие «на всякий случай».
      # ЗАДАЧА 67: игра открыта всем БЕЗ условий — аварийного стопа по доступу
      # больше нет (can_play всегда True). Закрыть игру нельзя ни переменной,
      # ни строкой в базе. Бан игрока работает как раньше.
      # Апгрейд: AURA_UPGRADE_ADMIN_ONLY=1 оставлен как «пожарный» тумблер.
      # DEPLOY.md §4.34 и §4.36.

  # ------------------------------------------------------------------ dan4Bot
  - type: web
    name: dan4Bot
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    # Версии подобраны так, чтобы сборка не падала НИ на 3.11, НИ на 3.14
    # (Render собирал этот сервис на 3.14 — см. DEPLOY.md §4.11):
    #   aiogram>=3.22,<3.32 → pydantic 2.12+ и aiohttp 3.13+ с готовыми wheel
    #   под cp311 и cp314;
    #   верхняя граница <3.32 — потому что 3.33 на Python 3.11 падает при
    #   импорте (unhashable type: 'FailFast').
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    # Бот — long-polling: Render убивает сервис без открытого порта, поэтому
    # bot.py поднимает крошечный aiohttp-ответчик и отвечает на HEAD /.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: AURA_API_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      # ЗАДАЧА 67: команды и кнопки в чате открыты всем и всегда. Переменная
      # оставлена только как историческая запись — код её не читает
      # (ADMINS_ONLY_BOT = False жёстко), закрыть чат нельзя.
      - key: AURA_ADMINS_ONLY_BOT
        value: "0"
